[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "scqp-qblox-measurement"
version = "0.1.0"
description = "Small raw-qblox-instruments measurement project for a lambda-type superconducting qubit pair"
requires-python = ">=3.12,<3.13"
dependencies = [
    "qblox-instruments>=1.1,<2",
    "qcodes>=0.52",
    "numpy>=2.0",
    "matplotlib>=3.9",
    "xarray>=2024.7",
    "h5netcdf>=1.3",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[tool.setuptools.packages.find]
include = ["scqp_qblox*", "experiments*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

